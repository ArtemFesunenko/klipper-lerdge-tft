# Lerdge-X touch screen (generated by klipper-lerdge-tft install.sh)
# The FSMC data bus (PD0,PD1,PD4,PD5,PD8-PD10,PD14,PD15,PE7-PE15), chip
# select NE1 (PD7) and RS (PD11) are fixed by the hardware.
# See config/sample-lerdge-tft.cfg in Klipper for all options.
# Pins from the Marlin Lerdge-X definition (there is no touch interrupt
# pin, so the touch panel is polled).

[display]
lcd_type: lerdge_tft
reset_pin: PD6
backlight_pin: PD3
touch_cs_pin: PB6
touch_sclk_pin: PB3
touch_mosi_pin: PB5
touch_miso_pin: PB4
#beeper_pin: PD12
#rotate_180: False
#touch_tap_activates: False
#backlight_timeout: 0
# Knob module (rotary encoder with push button on the touch screen),
# enabled by "install.sh --knob".  Swap the two encoder pins if the
# direction is wrong; use encoder_steps_per_detent: 2 if one click of the
# knob moves two steps.
#encoder_pins: ^PE4, ^PE3
#click_pin: ^!PE2
