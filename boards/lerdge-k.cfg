# Lerdge-K touch screen (generated by klipper-lerdge-tft install.sh)
# The FSMC data bus (PD0,PD1,PD4,PD5,PD8-PD10,PD14,PD15,PE7-PE15), chip
# select NE1 (PD7) and RS (PD11) are fixed by the hardware.
# See config/sample-lerdge-tft.cfg in Klipper for all options.

[display]
lcd_type: lerdge_tft
reset_pin: PD6
backlight_pin: PD3
touch_cs_pin: PG15
touch_sclk_pin: PB3
touch_mosi_pin: PB5
touch_miso_pin: PB4
touch_int_pin: ^!PG12
#beeper_pin: PC7
#rotate_180: False
#touch_tap_activates: False
#backlight_timeout: 0
